name: Vérifier et construire Mosaune

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Préparer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Préparer Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            extension-kit/go.sum
      - name: Installer les dépendances verrouillées
        run: npm ci
      - name: Vérifier le serveur, l'interface et le moteur d'extensions
        run: node scripts/project.mjs check
      - name: Construire Windows, Linux et ARM64
        if: runner.os == 'Linux'
        run: node scripts/project.mjs build
      - name: Conserver les exécutables de test
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mosaune-test-${{ github.sha }}
          path: |
            build/mosaune-*-windows-amd64.exe
            build/mosaune-*-linux-amd64
            build/mosaune-*-linux-arm64
            build/mosaune-*-SHA256SUMS.txt
            build/THIRD-PARTY-NOTICES.txt
            build/example-recognition.mosaune.zip
            build/recognition-repository/
          if-no-files-found: error
          retention-days: 14

  containers:
    name: Conteneurs HTTPS amd64 et arm64
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: extension-kit/go.sum
      - name: Préparer le paquet externe de test
        run: |
          mkdir -p build
          cd extension-kit
          CGO_ENABLED=0 GOOS=wasip1 GOARCH=wasm go build -trimpath -ldflags="-s -w" -o examples/recognition/module.wasm ./examples/recognition/source
          go run ./cmd/package-module examples/recognition/extension.json examples/recognition/module.wasm ../build/example-recognition.mosaune.zip
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Vérifier les définitions Compose
        env:
          MOSAUNE_PUBLIC_URL: https://127.0.0.1:47831
          MOSAUNE_DATA_PATH: /tmp/mosaune-ci-data
          MOSAUNE_TLS_PATH: /tmp/mosaune-ci-tls
          MOSAUNE_MEDIA_PATH: /tmp/mosaune-ci-media
        run: |
          docker compose -f deploy/compose.yml config --quiet
          docker compose -f deploy/casaos/Apps/Mosaune/docker-compose.yml config --quiet
      - name: Construire l'image amd64 de test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mosaune:ci-amd64
          cache-from: type=gha,scope=mosaune-amd64
          cache-to: type=gha,mode=max,scope=mosaune-amd64
      - name: Tester HTTPS, comptes, médias et redémarrage amd64
        run: node scripts/test-container.mjs mosaune:ci-amd64
      - name: Construire l'image arm64 de test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: mosaune:ci-arm64
          cache-from: |
            type=gha,scope=mosaune-amd64
            type=gha,scope=mosaune-arm64
          cache-to: type=gha,mode=max,scope=mosaune-arm64
      - name: Tester HTTPS, comptes, médias et redémarrage arm64 sous émulation
        run: node scripts/test-container.mjs mosaune:ci-arm64

  publish-preview:
    name: Publier la préversion sur GHCR
    needs: [verify, containers]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Identifier la version
        id: version
        run: |
          MOSAUNE_VERSION=$(jq -r '.version' package.json)
          echo "number=$MOSAUNE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier les deux architectures après les tests
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/car-lito/mosaune:${{ steps.version.outputs.number }}-preview
            ghcr.io/car-lito/mosaune:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=mosaune-amd64
            type=gha,scope=mosaune-arm64
